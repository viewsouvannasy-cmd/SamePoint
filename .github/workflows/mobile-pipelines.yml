name: mobile CI

on:
  push:
    branches: [main, dev]
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latests

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependince
        run: npm ci

      - name: Run test
        run: npm test
