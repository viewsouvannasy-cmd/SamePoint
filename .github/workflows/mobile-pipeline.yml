name: mobile CI

on:
  push:
    branches: [main, dev, test, agent/test]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-pipeline.yml"
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test
        run: npm run test
